
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JDP | Rastreio Industrial Supremo</title>
                         
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
         
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --cyan: #06b6d4;
            --gold: #fde047;
            --red: #ef4444;
            --green: #22c55e;
            --jdp-gold-gradient: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        /* CARREGAMENTO SUPREME HELENA */
        #loading-supreme {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        .resplendor-ouro {
            background: var(--jdp-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 26px;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 15px rgba(253, 224, 71, 0.2);
        }

        .spinner-supreme {
            width: 60px;
            height: 60px;
            margin-top: 25px;
            border: 6px solid transparent;
            border-top: 6px solid var(--green);   
            border-right: 6px solid var(--gold); 
            border-bottom: 6px solid var(--cyan); 
            border-left: 6px solid #a855f7;   
            border-radius: 50%;
            animation: spin-supreme 1s linear infinite;
        }

        @keyframes spin-supreme { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* PORTAL PRINCIPAL */
        #main-content {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--cyan); padding-bottom: 15px; }
        .header h1 { 
             font-family: 'Orbitron', sans-serif;
             color: var(--cyan); 
             font-size: 16px; 
             text-transform: uppercase; 
             letter-spacing: 2px; 
             margin: 0; 
             text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }

        .input-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .input-id {
            width: 100%;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #1e293b;
            background: #000;
            color: var(--gold);
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .input-id:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .btn-rastrear {
            width: 100%;
            padding: 18px;
            background: var(--jdp-gold-gradient);
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            cursor: pointer;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.4);
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-rastrear:active { transform: scale(0.98); }

        .btn-rastrear:disabled {
            filter: grayscale(1);
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* PAINEL DE STATUS EM TEMPO REAL */
        .status-container {
            margin-top: 25px;
            background: var(--card);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.5s ease;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }

        .status-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            color: #64748b;
        }

        .status-badge-exibicao {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .status-mensagem {
            font-size: 13px;
            line-height: 1.5;
            color: #cbd5e1;
            text-align: center;
            padding: 15px;
            background: #020617;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .btn-mapa-direto {
            width: 100%;
            padding: 14px;
            background: var(--green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(34, 197, 150, 0.3);
        }
    </style>
</head>
<body>

    <!-- LOADER HELENA -->
    <div id="loading-supreme">
        <div class="resplendor-ouro">DONY BURGUER'S</div>
        <div id="loader-text" style="margin-top: 15px; color: var(--cyan); font-size: 11px; letter-spacing: 2px; animation: pulse 1.5s infinite; font-family: 'Orbitron';">
            CONECTANDO AO REPOSITÓRIO...
        </div>
        <div class="spinner-supreme"></div>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="main-content">
        <div class="header">
            <h1>SISTEMA DE RASTREAMENTO 🛵</h1>
        </div>
                           
        <div class="input-container">
            <input type="text" id="input-id" class="input-id" placeholder="ID DO PEDIDO (JDP-)" maxlength="12">
        </div>
                           
        <button id="btn-master" class="btn-rastrear" onclick="rastrearPedido()">
            <i class="fas fa-search"></i> CONSULTAR STATUS
        </button>

        <!-- CONTAINER DE RESPOSTA REAL-TIME -->
        <div class="status-container" id="painelStatus">
            <div class="status-header">
                <span class="status-title" id="idDisplay">ID: #00000</span>
                <span class="status-badge-exibicao" id="badgeDisplay">STATUS</span>
            </div>
            <div class="status-mensagem" id="msgDisplay">
                Processando dados de telemetria...
            </div>
            <button class="btn-mapa-direto" id="btnMapa" onclick="irParaOMapa()">
                <i class="fas fa-map-marked-alt"></i> VER MOTOBOY NO MAPA
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const LOJA_ID = "LEOVARDIOS_burguer_2026";

        let bootCompleto = false;
        let idPedidoBuscado = "";

        // Referências dos Listeners Real-Time
        let refPendente = null;
        let refRastreio = null;
        let refConcluido = null;

        // Memória local de estados para fusão de dados
        let dadosPendente = null;
        let dadosRastreio = null;
        let dadosConcluido = null;

        window.addEventListener('load', () => {
            setTimeout(() => {
                bootCompleto = true;
                verificarRequisitos();
            }, 3000);
            setInterval(verificarRequisitos, 1000);
        });

        function verificarRequisitos() {
            const loader = document.getElementById('loading-supreme');
            const main = document.getElementById('main-content');
            const loaderText = document.getElementById('loader-text');

            if (navigator.onLine && bootCompleto) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    main.style.display = 'flex';
                }, 800);
            } else if (!navigator.onLine) {
                loader.style.display = 'flex';
                loader.style.opacity = '1';
                main.style.display = 'none';
                loaderText.innerText = "AGUARDANDO CONEXÃO COM A REDE...";
                loaderText.style.color = "var(--red)";
            }
        }
                           
        function rastrearPedido() {
            const input = document.getElementById('input-id');
            const btn = document.getElementById('btn-master');
            const id = input.value.trim().toUpperCase();

            if (!id) {
                alert("Por favor, digite o ID do seu pedido.");
                return;
            }

            idPedidoBuscado = id;
            btn.disabled = true;
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> CONECTANDO CANAL REAL-TIME...";

            // Desconecta canais anteriores se houver
            destruirListenersAnteriores();

            // Configuração dos caminhos de varredura
            refPendente = db.ref(`lojas/${LOJA_ID}/producao_pendente/${id}`);
            refRastreio = db.ref(`lojas/${LOJA_ID}/rastreio_ativo/${id}`);
            refConcluido = db.ref(`lojas/${LOJA_ID}/pedidos_concluidos/${id}`);

            // CANAL 1: Monitora Produção Cozinha
            refPendente.on('value', snap => {
                dadosPendente = snap.val();
                processarFusaoDeEstados();
            });

            // CANAL 2: Monitora Rastreio Ativo / Telemetria
            refRastreio.on('value', snap => {
                dadosRastreio = snap.val();
                processarFusaoDeEstados();
            });

            // CANAL 3: Monitora Conclusões Físicas
            refConcluido.on('value', snap => {
                dadosConcluido = snap.val();
                processarFusaoDeEstados();
            });
        }

        function destruirListenersAnteriores() {
            if (refPendente) refPendente.off();
            if (refRastreio) refRastreio.off();
            if (refConcluido) refConcluido.off();
            dadosPendente = null;
            dadosRastreio = null;
            dadosConcluido = null;
        }

        // --- MÁQUINA DE ESTADOS SOBERANA (FUSÃO DE DADOS EM TEMPO REAL) ---
        function processarFusaoDeEstados() {
            const btn = document.getElementById('btn-master');
            const painel = document.getElementById('painelStatus');
            
            btn.disabled = false;
            btn.innerHTML = "<i class='fas fa-search'></i> CONSULTAR STATUS";
            painel.style.display = "flex";
            document.getElementById('idDisplay').innerText = `ID: #${idPedidoBuscado}`;

            // ESTADO 1: ENTREGUE (Finalizado pelo PDV)
            if (dadosConcluido || (dadosRastreio && (dadosRastreio.status === "entregue" || dadosRastreio.status === "CONCLUIDO" || dadosRastreio.expirado === true))) {
                exibirEstadoConcluido();
                return;
            }

            // ESTADO 2: A CAMINHO / EM ROTA (Despachado no PDV, na_pista: true)
            if (dadosRastreio && (dadosRastreio.na_pista === true || dadosRastreio.status === "em_rota")) {
                exibirEstadoEmRota();
                return;
            }

            // ESTADO 3: PRONTO (Marcado como Pronto na Cozinha ou Pronto para Entrega no Rastreio)
            if ((dadosPendente && dadosPendente.status === "PRONTO") || (dadosRastreio && (dadosRastreio.status === "PRONTO_PARA_ENTREGA" || dadosRastreio.status === "PRONTO"))) {
                exibirEstadoPronto();
                return;
            }

            // ESTADO 4: PEDIDO ACEITO NA COZINHA (Na esteira de produção)
            if (dadosPendente && (dadosPendente.status === "ESPERA" || dadosPendente.status === "PREPARANDO" || dadosPendente.status === "Pendente")) {
                exibirEstadoPedidoAceito();
                return;
            }

            // ESTADO 5: AGUARDANDO CONFIRMAÇÃO DE PAGAMENTO
            if (dadosRastreio && dadosRastreio.giro_autorizado !== true) {
                exibirEstadoAguardandoPagamento();
                return;
            }

            // Se nenhuma das tabelas tiver o ID
            exibirEstadoInexistente();
        }

        // --- RENDERIZADORES DE ESTADO VISUAL ---

        function exibirEstadoPedidoAceito() {
            const badge = document.getElementById('badgeDisplay');
            const msg = document.getElementById('msgDisplay');
            const btnMapa = document.getElementById('btnMapa');

            badge.innerText = "ACEITO NA COZINHA";
            badge.style.background = "var(--gold)";
            badge.style.color = "#000";

            msg.innerHTML = `<i class="fas fa-receipt" style="color:var(--gold); font-size: 22px; margin-bottom: 10px; display:block;"></i>PEDIDO ACEITO NA COZINHA!<br>Seu pedido foi recebido com sucesso e já está na esteira de preparação industrial.`;
            btnMapa.style.display = "none";
        }

        function exibirEstadoPronto() {
            const badge = document.getElementById('badgeDisplay');
            const msg = document.getElementById('msgDisplay');
            const btnMapa = document.getElementById('btnMapa');

            badge.innerText = "PRONTO";
            badge.style.background = "var(--cyan)";
            badge.style.color = "#000";

            msg.innerHTML = `<i class="fas fa-hamburger" style="color:var(--cyan); font-size: 22px; margin-bottom: 10px; display:block;"></i>SEU PEDIDO ESTÁ PRONTO!<br>Lanche finalizado com sucesso. Aguardando o motoboy recolher para iniciar a entrega.`;
            btnMapa.style.display = "none";
        }

        function exibirEstadoEmRota() {
            const badge = document.getElementById('badgeDisplay');
            const msg = document.getElementById('msgDisplay');
            const btnMapa = document.getElementById('btnMapa');

            badge.innerText = "A CAMINHO";
            badge.style.background = "var(--green)";
            badge.style.color = "#000";

            msg.innerHTML = `<i class="fas fa-motorcycle" style="color:var(--green); font-size: 22px; margin-bottom: 10px; display:block;"></i>A CAMINHO!<br>Seu pedido já foi despachado. Abra o mapa de telemetria abaixo para acompanhar a rota do motoboy em tempo real!`;
            btnMapa.style.display = "flex";
        }

        function exibirEstadoConcluido() {
            const badge = document.getElementById('badgeDisplay');
            const msg = document.getElementById('msgDisplay');
            const btnMapa = document.getElementById('btnMapa');

            badge.innerText = "ENTREGUE";
            badge.style.background = "#1e293b";
            badge.style.color = "#94a3b8";

            msg.innerHTML = `<i class="fas fa-check-circle" style="color:var(--green); font-size: 22px; margin-bottom: 10px; display:block;"></i>ENTREGA CONCLUÍDA!<br>Obrigado pela preferência. O mapa foi desativado por segurança.`;
            btnMapa.style.display = "none";
        }

        function exibirEstadoAguardandoPagamento() {
            const badge = document.getElementById('badgeDisplay');
            const msg = document.getElementById('msgDisplay');
            const btnMapa = document.getElementById('btnMapa');

            badge.innerText = "AGUARDANDO PAGAMENTO";
            badge.style.background = "var(--red)";
            badge.style.color = "#fff";

            msg.innerHTML = `<i class="fas fa-wallet" style="color:var(--red); font-size: 22px; margin-bottom: 10px; display:block;"></i>AGUARDANDO PAGAMENTO...<br>O pedido foi enviado, mas aguarda a confirmação de recebimento pelo caixa do PDV.`;
            btnMapa.style.display = "none";
        }

        function exibirEstadoInexistente() {
            const badge = document.getElementById('badgeDisplay');
            const msg = document.getElementById('msgDisplay');
            const btnMapa = document.getElementById('btnMapa');

            badge.innerText = "NÃO ENCONTRADO";
            badge.style.background = "var(--red)";
            badge.style.color = "#fff";

            msg.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:var(--red); font-size: 22px; margin-bottom: 10px; display:block;"></i>ID INVÁLIDO OU EXPIRADO.<br>Não encontramos este ID nas tabelas ativas do sistema.`;
            btnMapa.style.display = "none";
        }

        function irParaOMapa() {
            const URL_MONITORAMENTO = "https://pradodalapa-hue.github.io/JDPSistemasmaprtyss688jfdssyiihfd/";
            window.location.href = `${URL_MONITORAMENTO}?pedido=${idPedidoBuscado}`;
        }

        // Permitir Enter no teclado
        document.getElementById('input-id').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') rastrearPedido();
        });
    </script>
</body>
</html>
